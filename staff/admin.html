<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Staff Dashboard - Escape Room Results</title>
    <!-- Local Supabase Library (must be in same folder) -->
    <script src="./supabase.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            /* Reuse game's jungle background */
            background: #0a1f1a;
            background-image: url('../images/jungle-bg.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: #fcf3d4;
            padding: 20px;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            /* Reuse game card styling */
            background: rgba(22, 36, 32, 0.94);
            border: 2px solid #b8a35c;
            border-radius: 20px;
            padding: 2rem;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        h1 {
            border-bottom: 2px solid #b8a35c;
            padding-bottom: 10px;
        }
        input, button {
            box-sizing: border-box;
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border-radius: 30px;
            border: none;
            font-size: 1rem;
            background: #ffffff;
            color: #1e2a3a;
        }
        button {
            background: #3c6e47;
            color: white;
            cursor: pointer;
            transition: 0.2s;
        }
        button:hover {
            background: #2d5a3a;
        }
        .button-small {
            width: auto;
            display: inline-block;
            padding: 8px 16px;
        }
        .danger-btn {
            background: #8b3a3a;
        }
        .danger-btn:hover {
            background: #6b2a2a;
        }
        .filter-box {
            display: flex;
            gap: 10px;
            align-items: center;
            margin: 15px 0;
        }
        .filter-box input {
            flex: 1;
            margin: 0;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            color: #fcf3d4;
        }
        th, td {
            border: 1px solid #b8a35c;
            padding: 10px;
            text-align: left;
        }
        th {
            background: #1e3a2a;
        }
        tr:nth-child(even) {
            background: rgba(255,255,255,0.05);
        }
        #loginSection {
            max-width: 400px;
            margin: 0 auto;
        }
        #dataSection {
            display: none;
        }
        .error {
            color: #ff6b6b;
            margin-top: 10px;
        }
        .winner-row {
            background: rgba(212,175,55,0.1) !important;
            font-weight: bold;
        }
        .filter-note {
            font-size: 0.8rem;
            color: var(--text-secondary, #c9d1b6);
            margin-top: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div id="loginSection">
            <h1>🔐 Staff Login</h1>
            <p>Enter the shared facilitator credentials to view results.</p>
            <input type="email" id="emailInput" placeholder="Staff Email" autocomplete="username">
            <input type="password" id="passwordInput" placeholder="Password" autocomplete="current-password">
            <button type="button" id="loginBtn">Log In</button>
            <div id="loginMessage" class="error"></div>
        </div>

        <div id="dataSection">
            <h1>🏆 Live Results</h1>
            <div class="filter-box">
                <input type="text" id="sessionFilter" placeholder="Filter by Session ID" onkeyup="fetchData()">
                <button type="button" id="clearFilterBtn" class="button-small" title="Clear the current filter and show all results">Clear</button>
            </div>
            <div class="filter-note" id="filterNote">Showing all sessions.</div>
            
            <div style="margin: 15px 0; display: flex; gap: 10px;">
                <button type="button" id="refreshBtn" class="button-small" title="Refresh the list from the database">Refresh</button>
                <button type="button" id="logoutBtn" class="button-small danger-btn" title="Log out of the dashboard">Log Out</button>
            </div>
            
            <table id="resultsTable">
                <thead>
                    <tr>
                        <th>Order</th>
                        <th>Team</th>
                        <th>Session</th>
                        <th>Code</th>
                        <th>Duration</th>
                        <th>Reported</th>
                    </tr>
                </thead>
                <tbody id="tableBody"></tbody>
            </table>
        </div>
    </div>

    <script>
        console.log("Admin Dashboard Script Loaded");

        const SUPABASE_URL = 'https://gvzujgnaozmevlbfhwfq.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imd2enVqZ25hb3ptZXZsYmZod2ZxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg0NTc1MzksImV4cCI6MjEwNDAzMzUzOX0.EQfgDbZ60jUUzCwguBw5VBpLFKUZvcBe18ezCLEnthE';
        
        if (typeof supabase === 'undefined') {
            console.error("CRITICAL: Supabase library failed to load. Check that supabase.js is in the same folder.");
            document.getElementById('loginMessage').textContent = "Error: Supabase library failed to load.";
        } else {
            const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

            async function login() {
                const email = document.getElementById('emailInput').value;
                const password = document.getElementById('passwordInput').value;
                document.getElementById('loginMessage').textContent = '';

                const { error } = await sb.auth.signInWithPassword({ email, password });
                if (error) {
                    console.error("Login Error:", error);
                    document.getElementById('loginMessage').textContent = 'Incorrect email or password.';
                } else {
                    document.getElementById('loginSection').style.display = 'none';
                    document.getElementById('dataSection').style.display = 'block';
                    fetchData();
                }
            }

            async function logout() {
                await sb.auth.signOut();
                location.reload();
            }

            async function fetchData() {
                const sessionFilter = document.getElementById('sessionFilter').value.trim();
                let query = sb.from('winners').select('*').order('id', { ascending: true });
                
                if (sessionFilter) {
                    // Filter by the exact session ID
                    query = query.eq('session_id', sessionFilter);
                    document.getElementById('filterNote').textContent = `Filtering by session: ${sessionFilter}`;
                } else {
                    document.getElementById('filterNote').textContent = 'Showing all sessions.';
                }

                const { data, error } = await query;
                if (error) {
                    console.error("Fetch Error:", error);
                    document.getElementById('loginMessage').textContent = 'Failed to load data: ' + error.message;
                    return;
                }

                const tbody = document.getElementById('tableBody');
                tbody.innerHTML = '';
                if (data.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="6">No winners recorded for this filter.</td></tr>';
                    return;
                }

                data.forEach((row, index) => {
                    const tr = document.createElement('tr');
                    if (index === 0) tr.className = 'winner-row';
                    tr.innerHTML = `
                        <td>${index + 1}</td>
                        <td>${row.team_name}</td>
                        <td>${row.session_id}</td>
                        <td>${row.full_code}</td>
                        <td>${row.duration}</td>
                        <td>${new Date(row.reported_at).toLocaleString()}</td>
                    `;
                    tbody.appendChild(tr);
                });
            }

            // Event Listeners
            document.getElementById('loginBtn').addEventListener('click', login);
            document.getElementById('logoutBtn').addEventListener('click', logout);
            document.getElementById('refreshBtn').addEventListener('click', fetchData);
            document.getElementById('clearFilterBtn').addEventListener('click', function() {
                document.getElementById('sessionFilter').value = '';
                fetchData();
            });
        }
    </script>
</body>
</html>
