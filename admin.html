<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Staff Dashboard - Escape Room Results</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #0a1f1a; color: #fcf3d4; padding: 20px; }
        .container { max-width: 900px; margin: 0 auto; background: rgba(22,36,32,0.9); padding: 2rem; border-radius: 20px; border: 1px solid #b8a35c; }
        h1 { border-bottom: 2px solid #b8a35c; padding-bottom: 10px; }
        input, button { padding: 10px; margin: 10px 0; border-radius: 30px; border: none; width: 100%; font-size: 1rem; }
        button { background: #3c6e47; color: white; cursor: pointer; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #b8a35c; padding: 10px; text-align: left; }
        th { background: #2c3e35; }
        #loginSection { max-width: 400px; margin: 0 auto; }
        #dataSection { display: none; }
        .error { color: #ff6b6b; }
        .winner-row { background: rgba(212,175,55,0.1); font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <div id="loginSection">
            <h1>🔐 Staff Login</h1>
            <p>Enter the shared facilitator credentials to view results.</p>
            <input type="email" id="emailInput" placeholder="Staff Email">
            <input type="password" id="passwordInput" placeholder="Password">
            <button onclick="login()">Log In</button>
            <div id="loginMessage" class="error"></div>
        </div>

        <div id="dataSection">
            <h1>🏆 Live Results</h1>
            <button onclick="logout()" style="background:#8b3a3a; width:auto; margin:0 0 10px 0;">Log Out</button>
            <button onclick="fetchData()" style="width:auto;">Refresh</button>
            <div id="filterBox">
                <input type="text" id="sessionFilter" placeholder="Filter by Session ID" onkeyup="fetchData()">
            </div>
            <table id="resultsTable">
                <thead>
                    <tr>
                        <th>Order</th>
                        <th>Team</th>
                        <th>Session</th>
                        <th>Code</th>
                        <th>Duration</th>
                        <th>Reported</th>
                    </tr>
                </thead>
                <tbody id="tableBody"></tbody>
            </table>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://gvzujgnaozmevlbfhwfq.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imd2enVqZ25hb3ptZXZsYmZod2ZxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg0NTc1MzksImV4cCI6MjEwNDAzMzUzOX0.EQfgDbZ60jUUzCwguBw5VBpLFKUZvcBe18ezCLEnthE';
        
        // Replace these with the ONE shared staff account you created in Supabase
        const SHARED_STAFF_EMAIL = 'facilitators@mmu.ac.uk';
        const SHARED_STAFF_PASSWORD = 'YourStrongSharedPassword123!';

        const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        async function login() {
            const email = document.getElementById('emailInput').value;
            const password = document.getElementById('passwordInput').value;
            
            // Log in using the shared account automatically
            const { error } = await supabase.auth.signInWithPassword({ email, password });
            
            if (error) {
                // Fallback: allow them to manually enter the email/password if they're not hardcoded
                document.getElementById('loginMessage').textContent = 'Login failed: ' + error.message;
            } else {
                document.getElementById('loginSection').style.display = 'none';
                document.getElementById('dataSection').style.display = 'block';
                fetchData();
            }
        }

        async function logout() {
            await supabase.auth.signOut();
            location.reload();
        }

        async function fetchData() {
            const sessionFilter = document.getElementById('sessionFilter').value;
            let query = supabase.from('winners').select('*').order('id', { ascending: true });
            
            if (sessionFilter) {
                query = query.eq('session_id', sessionFilter);
            }

            const { data, error } = await query;
            if (error) {
                console.error(error);
                return;
            }

            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = '';
            if (data.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6">No winners recorded yet.</td></tr>';
                return;
            }

            data.forEach((row, index) => {
                const tr = document.createElement('tr');
                if (index === 0) tr.className = 'winner-row';
                tr.innerHTML = `
                    <td>${index + 1}</td>
                    <td>${row.team_name}</td>
                    <td>${row.session_id}</td>
                    <td>${row.full_code}</td>
                    <td>${row.duration}</td>
                    <td>${new Date(row.reported_at).toLocaleString()}</td>
                `;
                tbody.appendChild(tr);
            });
        }
    </script>
</body>
</html>
