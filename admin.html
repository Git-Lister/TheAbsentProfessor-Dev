<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard – Winners & Sessions</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #0a1f1a; color: #fcf3d4; padding: 20px; }
        .container { max-width: 900px; margin: 0 auto; background: var(--card-bg, #1e2a22); padding: 2rem; border-radius: 20px; border: 1px solid #b8a35c; }
        h1 { border-bottom: 2px solid #b8a35c; padding-bottom: 10px; margin-top: 0; }
        .controls { display: flex; gap: 15px; margin: 20px 0; flex-wrap: wrap; }
        button { padding: 10px 20px; border-radius: 30px; border: none; font-size: 1rem; cursor: pointer; transition: 0.2s; }
        .btn-download { background: #3c6e47; color: white; }
        .btn-clear { background: #8b3a3a; color: white; }
        button:hover { transform: scale(1.02); opacity: 0.9; }
        .stats { display: flex; gap: 20px; margin-bottom: 20px; font-size: 0.9rem; color: #c9d1b6; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #b8a35c; padding: 12px; text-align: left; }
        th { background: #2c3e35; color: var(--text-primary); }
        .empty-state { text-align: center; padding: 40px; color: #c9d1b6; font-style: italic; }
    </style>
</head>
<body>
<div class="container">
    <h1>🏆 Live Results Dashboard</h1>
    
    <div class="controls">
        <button class="btn-download" id="downloadBtn">📥 Download Winners CSV</button>
        <button class="btn-clear" id="clearBtn">🗑️ Clear Local Logs (New Session)</button>
    </div>

    <div class="stats" id="statsDisplay">No winners recorded yet.</div>

    <table id="winnersTable">
        <thead>
            <tr>
                <th>Submission Order</th>
                <th>Team Name</th>
                <th>Unlock Code</th>
                <th>Unlocked At</th>
                <th>Duration</th>
                <th>Session ID</th>
            </tr>
        </thead>
        <tbody id="tableBody">
            <!-- Data injected here -->
        </tbody>
    </table>
</div>

<script>
    function loadWinners() {
        const data = JSON.parse(localStorage.getItem('winners_log') || '[]');
        const tbody = document.getElementById('tableBody');
        const stats = document.getElementById('statsDisplay');
        tbody.innerHTML = '';
        
        if (data.length === 0) {
            tbody.innerHTML = `<tr><td colspan="6" class="empty-state">No winners recorded yet. Run a test game to populate this table.</td></tr>`;
            stats.innerHTML = 'No winners recorded yet.';
            return;
        }

        stats.innerHTML = `<span>🏅 Total Winners: <strong>${data.length}</strong></span>`;
        
        // Sort by submission order (oldest first)
        data.sort((a,b) => a.order - b.order);

        data.forEach((entry, index) => {
            const row = document.createElement('tr');
            row.innerHTML = `
                <td>${index + 1}</td>
                <td><strong>${entry.team}</strong></td>
                <td>${entry.code}</td>
                <td>${new Date(entry.time).toLocaleString()}</td>
                <td>${entry.duration}</td>
                <td style="font-family: monospace; font-size: 0.85rem;">${entry.sessionId || 'N/A'}</td>
            `;
            tbody.appendChild(row);
        });
    }

    // Download CSV
    document.getElementById('downloadBtn').addEventListener('click', () => {
        const data = JSON.parse(localStorage.getItem('winners_log') || '[]');
        if (data.length === 0) return alert("No data to download.");
        const csv = 'Order,Team,Code,Unlocked At,Duration,Session ID\n' + 
            data.map((r, i) => `${i+1},${r.team},${r.code},${r.time},${r.duration},${r.sessionId}`).join('\n');
        const blob = new Blob([csv], { type: 'text/csv' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `winners-session-${new Date().toISOString().slice(0,10)}.csv`;
        a.click();
        URL.revokeObjectURL(url);
    });

    // Clear Local Logs (Start a new session)
    document.getElementById('clearBtn').addEventListener('click', () => {
        if (confirm("⚠️ This will permanently delete all local winner records for this device. Are you sure?")) {
            localStorage.removeItem('winners_log');
            loadWinners();
        }
    });

    loadWinners();
</script>
</body>
</html>
